name: AUTO SEGREGACJA
on: [push]
jobs:
  sort:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Segreguj pliki
        run: |
          mkdir -p src/main/java/com/piotr/firetrail
          mkdir -p src/main/resources
          [ -f FireTrail.java ] && mv FireTrail.java src/main/java/com/piotr/firetrail/FireTrail.java || true
          [ -f TrailListener.java ] && mv TrailListener.java src/main/java/com/piotr/firetrail/TrailListener.java || true
          [ -f plugin.yml ] && mv plugin.yml src/main/resources/plugin.yml || true
          [ -f config.yml ] && mv config.yml src/main/resources/config.yml || true

          cat >.github/workflows/build.yml << 'EOF'
          name: Build
          on: [push]
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: 17
                    cache: maven
                - run: mvn clean package
                - uses: actions/upload-artifact@v4
                  with:
                    name: FireTrail-jar
                    path: target/*.jar
          EOF

      - name: Commit zmian
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: posegregowano pliki do Maven"
