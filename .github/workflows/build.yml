name: Build FireTrail
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn clean package
      - uses: actions/upload-artifact@v4
        with:
          name: FireTrail-jar
          path: target/*.jar
